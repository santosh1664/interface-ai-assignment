<!-- Intentionally legacy: table layout, no test-IDs, non-semantic markup -->
<!DOCTYPE html>
<html>
<head>
  <title>CoreBanker v4.2 - Staff Login</title>
  <style>
    body { background: #c0c0c0; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    table { border-collapse: collapse; }
    .outer { width: 100%; height: 100vh; }
    .panel { background: #e8e8e8; border: 2px outset #fff; padding: 20px; width: 340px; }
    .title-bar { background: #000080; color: white; padding: 4px 8px; font-weight: bold; font-size: 14px; }
    .field-row td { padding: 4px 2px; font-size: 13px; }
    input[type=text], input[type=password] {
      border: 2px inset #888; background: white; padding: 2px 4px; width: 200px; font-size: 13px;
    }
    input[type=submit] {
      background: #d4d0c8; border: 2px outset #fff; padding: 3px 16px; font-size: 12px; cursor: pointer;
    }
    .error { color: red; font-size: 12px; padding: 4px 0; }
    .hint { color: #555; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
<table class="outer"><tr><td align="center" valign="middle">
  <div class="panel">
    <div class="title-bar">CoreBanker Staff Portal v4.2</div>
    <br>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <table class="field-row">
        <tr>
          <td>User&nbsp;ID:</td>
          <td><input type="text" name="username" autocomplete="off"></td>
        </tr>
        <tr>
          <td>Password:</td>
          <td><input type="password" name="password"></td>
        </tr>
        <tr>
          <td colspan="2" align="right">
            <input type="submit" value="Log In">
          </td>
        </tr>
      </table>
    </form>
    <div class="hint">Authorized personnel only. All access is monitored.</div>
  </div>
</td></tr></table>
</body>
</html>
